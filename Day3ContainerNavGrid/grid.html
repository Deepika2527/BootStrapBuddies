<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <link rel="stylesheet" href="../bootstrap-5.3.8-dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container border border-primary my-3">
        <h2>Grid example</h2>
        <div class="row py-5">
            <div class="col">
                <div class="bg-warning p-4">Col 1</div>
            </div>

            <div class="col">
                <div class="bg-warning p-4">Col 2</div>
            </div>

            <div class="col">
                <div class="bg-warning p-4">Col 3</div>
            </div>
        </div>
    </div>
    


     <div class="container border border-primary my-3">
        <h2>Grid example with col values</h2>
        <div class="row py-5">
            <div class="col-6">
                <div class="bg-success p-4">Col 1</div>
            </div>

            <div class="col-3">
                <div class="bg-success p-4">Col 2</div>
            </div>

            <div class="col-3">
                <div class="bg-success p-4">Col 3</div>
            </div>
        </div>
    </div>



    <div class="container border border-primary my-3">
        <h2>Grid example-3</h2>
        <div class="row py-5">
            <div class="col-12">
                <div class="bg-danger p-4">Col 1</div>
            </div>

            <div class="col-2">
                <div class="bg-danger p-4">Col 2</div>
            </div>

            <div class="col-2">
                <div class="bg-danger p-4">Col 3</div>
            </div>

            <div class="col-2">
                <div class="bg-danger p-4">Col 4</div>
            </div>
            <div class="col-2">
                <div class="bg-danger p-4">Col 5</div>
            </div>
            <div class="col-2">
                <div class="bg-danger p-4">Col 6</div>
            </div>
        </div>
    </div>
    


    <h3>Added</h3>

    <script src="../bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
